version: 2

# Weekly, grouped, small — a dependency PR nobody can review in one sitting gets merged unread.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
